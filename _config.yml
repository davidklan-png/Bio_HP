title: David Klan · kinokoholic.com
description: "AI products for real decisions: horse-racing ML, receipt automation, and citation-first Japanese tax research."
baseurl: ""
url: "https://kinokoholic.com"
markdown: kramdown
permalink: pretty

# Articles: full-text archive of LinkedIn articles (scripts/linkedin_articles.py).
collections:
  articles:
    output: true
    permalink: /articles/:name/
# Which copy search engines should treat as the original:
#   linkedin -> rel=canonical points at the LinkedIn article (default; no duplicate-content risk)
#   self     -> rel=canonical points at kinokoholic.com (site builds its own search authority)
articles_canonical: linkedin
exclude:
  - requirements.txt
  - agentic-workflows/
  - prompt-engineering-demos/
  - use-case-notebooks/
  - worker/
  - scripts/
  - tests/
  - test-planning/
  - shared/
  - .githooks/
  - .github/
  - CODEBASE_REVIEW_2026-02-17.md
  - AGENTS.md
  - README.md
  - REVISION_PLAYBOOK.md
  - TDD.md
  # Repo/build files that are not part of the site
  - Gemfile
  - Gemfile.lock
  - KINOKOMON_PAGE.md
  - PII-REMEDIATION.sh
  - handoff/
  - prompts/
  # Build input for ja/index.html (scripts/build_ja_home.py); not used at runtime
  - i18n/
