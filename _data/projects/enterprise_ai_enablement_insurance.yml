executive_summary:
  problem: Manulife Japan needed stronger application monitoring, a controlled transfer of BAU work to Global Operations, and a way to reduce the project-management effort spent collecting updates and assembling status reports.
  solution: Delivered two complementary AI systems. Production monitoring supports automation creation, alert analysis, and incident creation across 60 applications. A pilot PM Second Brain parses Microsoft and Atlassian updates, applies a delivery taxonomy, presents a React/Quartz dashboard, and drafts weekly status reports for human review.
  outcome: Improved operational visibility and transfer readiness while turning PM data wrangling and reporting into supporting work, leaving more time for delivery leadership and removing barriers for the team.
executive_summary_ja:
  problem: マニュライフ生命では、アプリ監視の強化、Global Operationsへの統制されたBAU移管、更新収集とステータス報告作成に費やすPM工数の削減が必要でした。
  solution: 2つの補完的なAIシステムを実装。本番監視は60アプリの自動化作成、アラート分析、インシデント起票を支援。パイロットPM Second BrainはMicrosoft・Atlassian更新を解析し、デリバリー分類を付与してReact／Quartzダッシュボードと週次報告案を生成します。
  outcome: 運用可視性と移管準備を強化し、PMのデータ整理・報告を補助業務化することで、チームの障害除去とデリバリーリーダーシップに注力できるようにしました。
