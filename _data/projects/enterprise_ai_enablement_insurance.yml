tech_details:
  rag_prompt_patterns:
    - Extract delivery entities and tag them as Objective, Key Result, Workstream, Task, Owner, Team, Risk/Issue, and Priority.
    - Draft weekly status narratives from the structured project corpus while retaining human approval before distribution.
    - Analyze operational alerts and monitoring context while preserving accountable human incident and recovery decisions.
  tools:
    - Microsoft and Atlassian APIs
    - Laptop-hosted parsing workflow
    - React and Quartz dashboard
    - Confluence and SharePoint corpus sharing
    - URL and synthetic monitoring
    - Centralized logging and Rapid Recovery procedures
  constraints:
    - Project updates arrive across multiple enterprise systems and need a consistent delivery taxonomy.
    - Weekly reports must remain drafts until reviewed and approved by the project manager.
    - Operational knowledge must be verified in practice before BAU ownership transfers.
    - Production monitoring and pilot PM automation require different maturity and governance controls.
  tradeoffs:
    - Local API-driven parsing provides direct control but depends on the laptop workflow being operated reliably.
    - Automated status drafting reduces data wrangling but deliberately retains human review and accountability.
    - A staged operational transition takes longer than a document-only handoff but reduces continuity and recovery risk.
tech_details_ja:
  rag_prompt_patterns:
    - デリバリー要素を抽出し、Objective、Key Result、Workstream、Task、Owner、Team、Risk/Issue、Priorityでタグ付け。
    - 構造化プロジェクトコーパスから週次報告案を作成し、配信前に人の承認を維持。
    - 責任あるインシデント判断・復旧判断を人に残しながら、アラートと監視コンテキストを分析。
  tools:
    - MicrosoftおよびAtlassian API
    - ラップトップ上の解析ワークフロー
    - React／Quartzダッシュボード
    - Confluence／SharePointによるコーパス共有
    - URL／Synthetic Monitoring
    - 集中ログとRapid Recovery手順
  constraints:
    - 複数の業務システムから届く更新を一貫したデリバリー分類へ統合する必要がある。
    - 週次報告はPMが確認・承認するまでドラフトとして扱う。
    - BAU責任移管前に、運用知識を実務で検証する必要がある。
    - 本番監視とパイロットPM自動化では、成熟度とガバナンス管理が異なる。
  tradeoffs:
    - ローカルAPI解析は直接制御できる一方、ラップトップワークフローの安定運用に依存する。
    - 自動報告案はデータ整理を減らすが、人のレビューと説明責任を意図的に残す。
    - 段階的運用移管は文書のみの引き継ぎより時間がかかるが、継続性と復旧リスクを抑える。
lessons_learned:
  - The best PM automation makes reporting secondary to leadership, decisions, and removing barriers.
  - A shared taxonomy turns fragmented updates into a reusable project corpus.
  - A document is not a handover; readiness must be demonstrated through shadowing and reverse-shadowing.
  - Production monitoring and pilot knowledge systems should state their maturity explicitly.
lessons_learned_ja:
  - 優れたPM自動化は、報告を補助業務にし、リーダーシップ、判断、障害除去を中心に戻す。
  - 共通分類により、分散した更新を再利用可能なプロジェクトコーパスへ変換できる。
  - 文書完成は引き継ぎ完了ではなく、Shadow／Reverse-shadowで準備状況を証明する必要がある。
  - 本番監視とパイロット知識システムは成熟度を明示すべき。
improve_next:
  - Complete the remaining operational handover and retain post-transfer feedback loops.
  - Expand readiness quality gates across all 60 application scopes.
  - Harden the pilot PM Second Brain for repeatable operation beyond the laptop workflow.
  - Add traceability from weekly status statements back to tagged source updates.
improve_next_ja:
  - 残る運用移管を完了し、移管後のフィードバックループを維持。
  - 60アプリ全体へ準備状況品質ゲートを拡張。
  - ラップトップ運用を超えて、パイロットPM Second Brainを再現可能に強化。
  - 週次報告の各記述からタグ付き元更新への追跡性を追加。
