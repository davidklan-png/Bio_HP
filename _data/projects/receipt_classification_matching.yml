  secondary_cta: GitHubでソースを見る
  secondary_cta_url: https://github.com/davidklan-png/dazbeez
  privacy_note: 実際のアプリはClerkで保護され、noindexに設定されています。このページの画面例はすべて合成データです。
  proof:
    - value: 写真を先に
      label: 経理情報を求める前に、レシートを確実に保存します。
    - value: ローカルAI
      label: Mac MLXの画像処理により、レシート画像をシステムの管理範囲内に保ちます。
    - value: 証拠とクローズ
      label: 突合ゲート、ハッシュ、保管メタデータにより最終成果物を検証可能にします。
  problem:
    eyebrow: 業務上の課題
    title: 月次クローズを、レシート探しから始めない。
    intro: 従来は多数の紙レシートを月1回の一括スキャンにまとめ、手作業の突合と脆いファイル置き場に依存していました。Dazbeez Receiptsは作業を明確で復旧可能な状態に分離します。
    before_label: 導入前
    before:
      - 一括スキャンでは個々のレシート履歴が埋もれる。
      - 突合が月末まで遅れ、記憶に依存する。
      - ファイルの寄せ集めだけでは完全性を説明しにくい。
    after_label: Dazbeez Receipts
    after:
      - 各レシートを不変かつ監査可能なレコードにする。
      - 取り込み・処理・レビュー・突合を別々の状態として見せる。
      - 必要な作業が残る月は確定できない。
  workflow:
    eyebrow: プロダクトワークフロー
    title: 一度の素早い取り込みから、説明できる月次クローズへ。
    intro: 現場の取り込みはCloudflareが常時受け付け、画像処理は準備ができた時に非公開Macで実行します。重要な財務判断には人の確認を残します。
    steps:
      - code: "01"
        title: 取り込む
        text: 写真撮影、デジタルファイルのアップロード、またはメール添付の転送で受け付けます。
        detail: スマホ · デスクトップ · メール
      - code: "02"
        title: バッファする
        text: オリジナルをR2に保存し、D1に状態を書き、抽出ジョブを耐久キューへ送ります。
        detail: R2 · D1 · Cloudflare Queue
      - code: "03"
        title: ローカル抽出
        text: Mac MLXの画像言語モデルが読み取り、決定論的パーサーがガードレールとして検証します。
        detail: MLX VLM · regex検証
      - code: "04"
        title: レビュー
        text: 店舗名、日付、金額、科目、出席者、支払経路を必要な時に確認します。
        detail: Human-in-the-loop
      - code: "05"
        title: 突合する
        text: 信頼度、外貨情報、明示的な確認を使い、AMEX明細とレシートを対応付けます。
        detail: 支援型・暗黙確定なし
      - code: "06"
        title: 確定・出力
        text: ブロッカーを解消して月を確定し、完全性を示す会計士向けパッケージを作成します。
        detail: CSV · 証憑 · SHA-256マニフェスト
  features:
    eyebrow: 実運用を中心に設計
    title: 摩擦を減らす場所は自動化し、信頼が必要な場所にはガードレールを。
    items:
      - kicker: 高速取り込み
        title: 経理フォームではなく、まず投函箱
        text: モバイルの大きな操作一つで画像を即時保存。AMEX・現金は事前選択できますが、メタデータ不足で取り込みを止めません。
      - kicker: 非公開処理
        title: Store-and-forward方式のローカル画像AI
        text: Macが停止中でも取り込みは耐久キューに残ります。処理待ちは「レシート欠落」と混同せず、独立した状態で表示します。
      - kicker: レビュー・突合
        title: 信頼度を見せ、上限を設ける
        text: 金額・日付・店舗・通貨の根拠を説明。支払経路が不明な候補は、人が確認するまでAMEXとして確定しません。
      - kicker: メール取り込み
        title: 未認証メールはトリアージで止める
        text: 専用アドレスへの添付は別受信箱に入り、人が昇格させるまで税務レコードになりません。
      - kicker: 会計士への納品
        title: ファイルだけでなく証拠を出力
        text: 確定エクスポートは、突合データと証憑をハッシュ、アーカイブメタデータ、監査ログとともにまとめます。
  mockups:
    eyebrow: プライバシーに配慮したプロダクトツアー
    title: 作業状態を一目で把握。
    intro: プロダクトのソースを基に、合成した店舗名・日付・金額で再構成した画面例です。本番レシートのデータは使用していません。
    capture_aria: 合成データを使ったモバイル高速取り込み画面の例
    capture_title: まず保存。分類は後から。
    capture_caption: モバイルでは標準カメラを開いて即時アップロードし、支払方法のヒントは任意のまま軽量に保ちます。
    review_aria: 合成データを使った抽出・レビュー画面の例
    review_title: 不確実性を、次の操作につなげる。
    review_caption: キュー状態、抽出状態、編集可能な項目により、モデル出力をブラックボックス化せず確認可能にします。
    close_aria: 合成データを使った突合・月次クローズ画面の例
    close_title: 何がクローズを止めているかを明確に。
    close_caption: 月を封印する前に、突合根拠、コンプライアンスチェック、出力状態を一つの流れにまとめます。
  trust:
    eyebrow: 信頼モデル
    title: 失敗を見える形で扱う財務自動化。
    intro: 認証、保存の完全性、処理状態、月次確定ポリシーを、デプロイ上の注記ではなくプロダクトの挙動として扱います。
    items:
      - title: 人と機械の認証を分離
        text: 人向け画面・APIはClerkで保護し、処理Macとペアリング済み端末には独立した限定資格情報を使用します。
      - title: オリジナルを上書きしない
        text: レシート画像は不変のオブジェクトキー、コンテンツハッシュ、保守的な保管メタデータをR2に保持します。
      - title: 未処理作業を消さない
        text: 取り込み済み、キュー待ち、レビュー可能、突合済み、確定済みを明示し、状態変更を監査イベントに残します。
      - title: クローズはハードゲート
        text: 処理待ち、不完全レコード、突合不足、コンプライアンス上のブロッカーが残る限り確定できません。
  architecture:
    eyebrow: 技術構成
    title: 常時取り込み。非公開推論。検証可能な出力。
    intro: 取り込みの可用性と推論処理を意図的に分離し、財務画像をホスト型OCRへ送らずに現場の信頼性を維持します。
    lanes:
      - label: Cloudflare edge
        title: 取り込みと耐久状態
        text: Workers上のNext.js、Clerk、D1、不変R2、Email Routing、pull型Queueで受付を常時利用可能かつ復旧可能にします。
      - label: 非公開Mac
        title: MLX画像処理
        text: キューコンシューマーがオリジナルを取得し、ローカル画像言語モデルと決定論的ガードレールを実行して構造化結果を書き戻します。
      - label: 管理されたクローズ
        title: レビュー・突合・保管
        text: 人手レビュー、AMEX突合、コンプライアンス確認、出力改訂、封印アーカイブを一つの監査可能な状態モデルで扱います。
  tradeoffs:
    title: 意図的なトレードオフ
    items:
      - ローカル推論はデータを保護し独自モデルを可能にする一方、処理量はMacの稼働状況に依存します。
      - 不変オリジナルと長期保管は法定記録を強化する一方、保管コストと運用責任を増やします。
      - 人の確認は財務上の暗黙エラーを抑える一方、完全自律の月次クローズを意図的に避けます。
  final_cta:
    eyebrow: 非公開設計 · 詳細は説明可能
    title: 月次クローズ全体の流れをご覧になりますか？
    text: 取り込み、レビュー、突合、コンプライアンス、エクスポートまでを個別にご案内します。
    button: ウォークスルーを依頼
