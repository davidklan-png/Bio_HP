lessons_learned:
  - Fail-closed auth and immutable originals matter more than slick UI for finance trust.
  - One-receipt-per-record beats composite scans for both capture ergonomics and auditability.
  - SHA-256 export manifests turn "a folder of PDFs" into a verifiable statutory archive.
lessons_learned_ja:
  - 財務の信頼では、洗練されたUIより fail-closed 認証と不変オリジナルが重要。
  - 1レシート＝1レコードは、取り込みの操作性と監査性の両面で一括スキャンに勝る。
  - SHA-256エクスポートマニフェストは「PDFの寄せ集め」を検証可能な法定アーカイブに変える。
improve_next:
  - Add active-learning loops feeding reviewer corrections back into the extraction provider.
  - Add anomaly detection for missing or duplicate receipts against the statement.
  - Add monthly close scorecards (match rate, exceptions, category drift).
improve_next_ja:
  - レビュー修正を抽出プロバイダに還元するアクティブラーニングループを追加する。
  - 明細に対するレシートの欠落・重複を検知する異常検知を追加する。
  - 月次クローズのスコアカード(マッチ率・例外・カテゴリのドリフト)を追加する。
repro:
  runnable: false
  steps:
    - Authenticate through Cloudflare Access — the module is private and noindexed.
    - Capture a receipt from the phone and confirm the immutable R2 original plus the D1 record.
    - Import an AMEX CSV, reconcile against captured receipts, and clear the review queue.
    - Run the monthly export and verify the SHA-256 manifest written to the archive bucket.
repro_ja:
  steps:
    - Cloudflare Access で認証する — モジュールは非公開かつ noindex。
    - スマホからレシートを取り込み、不変のR2オリジナルとD1レコードを確認する。
    - AMEXのCSVを取り込み、取り込み済みレシートと突合し、レビューキューを処理する。
    - 月次エクスポートを実行し、アーカイブバケットに書き込まれたSHA-256マニフェストを検証する。
