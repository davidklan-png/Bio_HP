id: receipt_classification_matching
detail_page: /projects/receipt-classification-and-matching-system/
name: Dazbeez Receipts
name_ja: Dazbeez Receipts
one_line_value: Photo-first receipt capture, local vision AI, AMEX reconciliation, and an audit-ready monthly close.
one_line_value_ja: 写真優先のレシート取り込み、ローカル画像AI、AMEX突合、監査対応の月次クローズ。
icon: receipt
tags:
  - Cloudflare Platform
  - Local Vision AI
  - Compliance Workflow
tags_ja:
  - Cloudflare Platform
  - ローカル画像AI
  - コンプライアンス業務
impact_bullets:
  - Replaced composite paper scans with one-receipt-per-record mobile and email capture.
  - Separated always-on Cloudflare intake from private Mac MLX vision processing through a durable queue.
  - Turned reconciliation and export into a gated, verifiable monthly close with immutable originals.
impact_bullets_ja:
  - 紙レシートの一括スキャンを、1レシート＝1レコードのモバイル・メール取り込みに置き換え。
  - 常時稼働のCloudflare取り込みと、Mac MLXによる非公開の画像処理を耐久キューで分離。
  - 突合とエクスポートを、不変オリジナルに基づく検証可能な月次クローズへ転換。

splash:
  eyebrow: Private finance operations module · shipping
  title: Dazbeez Receipts
  tagline: Capture now. Close the month with confidence.
  summary: A photo-first receipt workflow that keeps capture effortless, runs vision extraction locally, assists AMEX reconciliation, and produces a retention-aware accountant package.
  status: Private module · public case study
  primary_cta: Request a private walkthrough
  primary_cta_url: "https://dazbeez.com/contact?message=Hi+David%2C+I%27d+like+a+private+walkthrough+of+Dazbeez+Receipts%2C+including+the+capture%2C+review%2C+AMEX+reconciliation%2C+compliance%2C+and+accountant+export+workflow."
  secondary_cta: View the source on GitHub
  secondary_cta_url: https://github.com/davidklan-png/dazbeez
  privacy_note: The live application is Clerk-protected and noindexed. Every interface shown here uses synthetic data.
  proof:
    - value: Photo first
      label: Save the receipt before asking for accounting detail.
    - value: Local AI
      label: Mac MLX vision processing keeps receipt images inside the system's estate.
    - value: Close with proof
      label: Reconciliation gates, hashes, and retention metadata make the final package verifiable.
  problem:
    eyebrow: The operating problem
    title: Month close should not begin with a scavenger hunt.
    intro: The old workflow compressed many paper receipts into one monthly scan, then relied on manual matching and a fragile folder of files. Dazbeez Receipts separates the work into clear, recoverable states.
    before_label: Before
    before:
      - Composite scans hide individual receipt history.
      - Matching happens late and depends on memory.
      - A folder of exports provides little integrity evidence.
    after_label: With Dazbeez Receipts
    after:
      - Each receipt becomes an immutable, auditable record.
      - Capture, processing, review, and reconciliation stay visibly distinct.
      - Month close cannot finalize while required work remains.
  workflow:
    eyebrow: Product workflow
    title: From one quick capture to one defensible close.
    intro: Cloudflare stays available in the field. The private Mac does the vision work when it is ready. Human judgment remains in the financial decisions that matter.
    steps:
      - code: "01"
        title: Capture
        text: Take a photo, upload a digital file, or forward an attachment to the receipts inbox.
        detail: Phone · desktop · email
      - code: "02"
        title: Buffer
        text: Store the original in R2, write workflow state to D1, and enqueue extraction durably.
        detail: R2 · D1 · Cloudflare Queue
      - code: "03"
        title: Extract locally
        text: A Mac MLX vision-language model reads the image; deterministic parsing remains a guardrail.
        detail: MLX VLM · regex validation
      - code: "04"
        title: Review
        text: Confirm merchant, date, amount, category, attendees, and the payment path only when needed.
        detail: Human-in-the-loop
      - code: "05"
        title: Reconcile
        text: Match AMEX lines and receipts with confidence bands, foreign-currency context, and explicit confirmation.
        detail: Assisted, never silent
      - code: "06"
        title: Close and export
        text: Resolve blockers, finalize the month, and build the accountant package with integrity evidence.
        detail: CSV · proofs · SHA-256 manifest
  features:
    eyebrow: Built around real operations
    title: Automation where it removes friction. Guardrails where trust matters.
    items:
      - kicker: Rapid capture
        title: A drop box, not an accounting form
        text: One large mobile action saves the image immediately. AMEX or cash can be preselected, but missing metadata never prevents capture.
      - kicker: Private processing
        title: Store-and-forward local vision AI
        text: Captures survive Mac downtime in a durable queue. Pending processing is shown as its own state instead of masquerading as a missing receipt.
      - kicker: Review and reconcile
        title: Confidence is visible and bounded
        text: Suggested matches explain amount, date, merchant, and currency evidence. Unknown-payment matches require confirmation before they become AMEX.
      - kicker: Email intake
        title: Untrusted mail stops at triage
        text: Attachments sent to the receipts aliases enter a separate inbox. A human must promote them before they become tax records.
      - kicker: Accountant delivery
        title: The close produces evidence, not just files
        text: Finalized exports package reconciliation data and receipt proofs with hashes, archive metadata, and an audit trail.
  mockups:
    eyebrow: Privacy-safe product tour
    title: The working states are visible at a glance.
    intro: Illustrative interfaces reconstructed from the product source with synthetic merchants, dates, and amounts. No production receipt data is shown.
    capture_aria: Illustrative mobile rapid-capture interface using synthetic data
    capture_title: Save first. Classify later.
    capture_caption: The mobile path opens the native camera, uploads immediately, and keeps optional payment hints lightweight.
    review_aria: Illustrative extraction and review interface using synthetic data
    review_title: Make uncertainty actionable.
    review_caption: Queue state, extraction health, and editable fields keep model output reviewable instead of hiding it behind automation.
    close_aria: Illustrative reconciliation and month-close interface using synthetic data
    close_title: Know exactly what blocks close.
    close_caption: Matching evidence, compliance checks, and export status converge before a month can be sealed.
  trust:
    eyebrow: Trust model
    title: Financial automation that fails visibly.
    intro: The system treats authentication, storage integrity, processing state, and month-close policy as product behavior—not deployment footnotes.
    items:
      - title: Separate human and machine gates
        text: Clerk protects people-facing pages and APIs; the processor and paired capture devices use narrow, independent credentials.
      - title: Originals are never overwritten
        text: Receipt images retain immutable object keys, content hashes, and conservative retention metadata in R2.
      - title: Pending work cannot disappear
        text: Captured, queued, review-ready, reconciled, and finalized are explicit states with audit events around changes.
      - title: Close is a hard gate
        text: Processing backlog, incomplete records, reconciliation gaps, and compliance blockers prevent finalization instead of becoming warnings to ignore.
  architecture:
    eyebrow: Under the hood
    title: Always-on capture. Private inference. Verifiable output.
    intro: The architecture deliberately separates availability from inference so field capture stays reliable without sending financial images to a hosted OCR service.
    lanes:
      - label: Cloudflare edge
        title: Capture and durable state
        text: Next.js on Workers, Clerk, D1, immutable R2 storage, Email Routing, and a pull-based Queue keep intake available and recoverable.
      - label: Private Mac
        title: MLX vision processing
        text: The queue consumer fetches an original, runs a local vision-language model, applies deterministic guardrails, and writes structured results back.
      - label: Controlled close
        title: Review, reconcile, retain
        text: Human review, AMEX matching, compliance checks, export revisions, and the sealed archive share one auditable state model.
  tradeoffs:
    title: Deliberate tradeoffs
    items:
      - Local-only inference protects receipt data and enables bespoke models, but throughput depends on Mac availability.
      - Immutable originals and long retention strengthen the statutory record, but increase storage and operational responsibility.
      - Human confirmation limits silent financial errors, but intentionally prevents a fully autonomous month close.
  final_cta:
    eyebrow: Private by design · explainable in detail
    title: Want to see the complete month-close workflow?
    text: Request a private walkthrough of the capture, review, reconciliation, compliance, and export experience.
    button: Request a walkthrough

