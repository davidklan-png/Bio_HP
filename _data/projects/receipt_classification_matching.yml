id: receipt_classification_matching
detail_page: /projects/receipt-classification-and-matching-system/
name: Receipt Capture & AMEX Reconciliation
name_ja: レシート取り込み・AMEX突合システム
one_line_value: Mobile-first receipt capture with AMEX statement reconciliation and audit-ready, 10-year-retention accountant export, running on Cloudflare's edge.
one_line_value_ja: モバイルファーストのレシート取り込み、AMEX明細との突合、監査対応の10年保管エクスポートをCloudflareエッジ上で実現。
icon: receipt
tags:
  - Cloudflare Workers
  - Document AI
  - Compliance & Retention
tags_ja:
  - Cloudflare Workers
  - ドキュメントAI
  - コンプライアンス・保管
impact_bullets:
  - Replaced monthly composite paper-receipt scans with one-receipt-per-record mobile capture.
  - Automated AMEX statement-to-receipt reconciliation behind a human review-and-correction queue.
  - Hardened tax-record retention with immutable R2 originals and SHA-256-hashed export manifests.
impact_bullets_ja:
  - 月次のレシート一括スキャンを、1レシート＝1レコードのモバイル取り込みに置き換え。
  - AMEX明細とレシートの突合を自動化し、人手のレビュー・修正キューを後段に配置。
  - 不変のR2オリジナルとSHA-256ハッシュ付きエクスポートで税務記録の保管を強化。
executive_summary:
  problem: Monthly expense prep meant scanning a composite sheet of paper receipts, hand-matching them to the AMEX statement, and trusting a fragile, non-auditable paper trail before company tax submission.
  solution: Built an access-gated receipt module inside the Dazbeez Next.js/Cloudflare Workers app — iPhone capture, structured extraction, AMEX CSV import and reconciliation, and a monthly accountant export — backed by D1 records and immutable R2 image storage carrying conservative retention metadata.
  outcome: A repeatable, audit-ready monthly close where every receipt is a first-class record, reconciliation is assisted rather than manual, and the statutory archive is hashed and retention-locked.
executive_summary_ja:
  problem: 月次の経費処理は、紙のレシートを一括スキャンしてAMEX明細と手作業で突合し、監査に耐えない脆い紙の証跡に頼ったまま会社の税務申告を行う状態でした。
  solution: Dazbeezの Next.js／Cloudflare Workers アプリ内にアクセス制限付きのレシートモジュールを構築。iPhone取り込み、構造化抽出、AMEXのCSV取り込みと突合、月次の会計士向けエクスポートを、D1レコードと保管メタデータ付き不変R2ストレージで支えています。
  outcome: すべてのレシートが第一級のレコードとなり、突合は手作業ではなく支援型となり、法定アーカイブはハッシュ化・保管ロックされた、再現可能で監査対応の月次クローズを実現しました。
use_case:
  summary: A solo consultancy and its accountant need trustworthy, low-effort monthly expense reconciliation that still stands up to a tax audit years later.
  stakeholders:
    - Operator capturing receipts on a phone
    - Accountant consuming the monthly export
    - Tax authority audit and retention requirements
use_case_ja:
  summary: 一人法人とその会計士は、手間をかけずに信頼でき、数年後の税務調査にも耐えられる月次の経費突合を必要としていました。
  stakeholders:
    - スマホでレシートを取り込む運用担当
    - 月次エクスポートを受け取る会計士
    - 税務当局の監査・保管要件
architecture:
  overview: Receipts and AMEX data flow through an isolated, Cloudflare-Access-protected route group. Images land immutably in R2, records in D1, and finalized months export as hashed CSV bundles into a separate archive bucket.
  diagram:
    - "[iPhone capture · /receipts/capture]"
    - "           |"
    - "  Upload API -> R2 original (never overwritten)"
    - "           |"
    - "  D1 receipt record + structured extraction"
    - "           |"
    - "[AMEX CSV import · /receipts/amex]"
    - "           |"
    - "  Reconciliation matching -> review queue"
    - "           |"
    - "[Monthly export · /receipts/export]"
    - "           |"
    - "  SHA-256 manifest -> R2 archive (10y, legal hold)"
architecture_ja:
  overview: レシートとAMEXデータは、Cloudflare Accessで保護された独立ルートグループを通ります。画像はR2に不変で保存され、レコードはD1に、確定した月はハッシュ化CSVバンドルとして別のアーカイブバケットにエクスポートされます。
  diagram:
    - "[iPhone取り込み · /receipts/capture]"
    - "           |"
    - "  アップロードAPI -> R2オリジナル(上書き不可)"
    - "           |"
    - "  D1レシートレコード + 構造化抽出"
    - "           |"
    - "[AMEX CSV取り込み · /receipts/amex]"
    - "           |"
    - "  突合マッチング -> レビューキュー"
    - "           |"
    - "[月次エクスポート · /receipts/export]"
    - "           |"
    - "  SHA-256マニフェスト -> R2アーカイブ(10年・リーガルホールド)"
tech_details:
  rag_prompt_patterns:
    - Pluggable OCR/LLM extraction provider — swap models without touching capture or reconcile.
    - Structured field extraction (vendor, date, total, tax) with per-field confidence scoring.
    - Confidence thresholds route low-certainty receipts into the human review queue.
  tools:
    - Next.js 16 (App Router) on Cloudflare Workers via OpenNext
    - Cloudflare D1 for records, R2 for immutable images and the archive bucket
    - Cloudflare Access (zero-trust) with HTTP Basic-auth local fallback
  constraints:
    - Tax records require ~10-year retention and a defensible audit trail.
    - Receipt originals must never be mutated or silently deleted.
    - The module must stay invisible to the public site and to search engines.
  tradeoffs:
    - Fail-closed auth (deny when unconfigured) chosen over convenience.
    - Immutable storage and retention locks raise storage cost but protect the statutory copy.
    - Assisted, not fully automated, reconciliation keeps a human in the loop for finance trust.
tech_details_ja:
  rag_prompt_patterns:
    - プラガブルなOCR/LLM抽出プロバイダ — 取り込みや突合に触れずモデルを差し替え可能。
    - 構造化フィールド抽出(ベンダー・日付・合計・税額)とフィールド単位の信頼度スコア。
    - 信頼度しきい値により、確度の低いレシートを人手レビューキューへ振り分け。
  tools:
    - Next.js 16(App Router)を OpenNext 経由で Cloudflare Workers 上に
    - レコードに Cloudflare D1、不変画像とアーカイブに R2
    - Cloudflare Access(ゼロトラスト)とローカルの HTTP Basic 認証フォールバック
  constraints:
    - 税務記録には約10年の保管と、説明可能な監査証跡が必要。
    - レシートのオリジナルは改変も暗黙削除も不可。
    - モジュールは公開サイトと検索エンジンから不可視を維持。
  tradeoffs:
    - 利便性より、未設定時は拒否する fail-closed 認証を選択。
    - 不変ストレージと保管ロックは保管コストを上げるが、法定コピーを保護。
    - 完全自動ではなく支援型の突合とし、財務の信頼のため人手を介在。
